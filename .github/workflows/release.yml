name: Release

# Baut die Desktop-Apps und veröffentlicht sie als GitHub Release samt
# Update-Manifest. Ausgelöst durch einen Versions-Tag:
#
#   npm version 0.2.0 && git push --follow-tags
#
# Warum überhaupt CI: macOS-Apps lassen sich nur auf macOS bauen. Ohne einen
# Mac im Haus ist ein macOS-Runner der einzige Weg — und nebenbei fällt der
# Windows- und Linux-Build mit ab.
on:
  push:
    tags:
      - 'v*'
  # Zum Ausprobieren ohne Tag - erzeugt einen Entwurf, kein öffentliches Release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Ein fehlgeschlagener Mac-Build soll den Windows-Build nicht abbrechen.
      # Sonst steht man mit gar nichts da statt mit der Hälfte.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            name: macOS (Apple Silicon)
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            name: macOS (Intel)
          - platform: ubuntu-22.04
            args: ''
            name: Linux
          - platform: windows-latest
            args: ''
            name: Windows

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable
        with:
          # Auf macOS beide Architekturen, sonst schlägt --target fehl.
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust-Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # Sonst teilen sich Intel- und ARM-Build denselben Cache-Schlüssel
          # und überschreiben sich gegenseitig.
          key: ${{ matrix.args }}

      - name: Systemabhängigkeiten (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: npm-Pakete
        run: npm ci

      - name: Bauen und veröffentlichen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Ohne diesen Schlüssel entsteht kein signiertes Update - der
          # Updater lehnt unsignierte Pakete ab, und zwar zu Recht.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          # Vite backt diese Werte zur BUILDZEIT ins Bundle. Fehlen sie, baut
          # der Job durch und liefert eine App im lokalen Modus aus - ohne
          # Login, ohne Sync. Der Build schlägt dabei NICHT fehl, deshalb
          # steht die Prüfung weiter unten.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_APP_URL: ${{ secrets.VITE_PUBLIC_APP_URL }}

          # Notarisierung: nur gesetzt, wenn die Secrets hinterlegt sind.
          # Ohne sie entsteht eine unsignierte App - lauffähig, aber Gatekeeper
          # verlangt beim ersten Start Rechtsklick → Öffnen
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__-test' }}
          releaseName: 'Planner __VERSION__'
          releaseBody: |
            Automatisch erzeugt. Die Update-Funktion in der App findet diese
            Version selbst — ein manueller Download ist nur für die
            Erstinstallation nötig.
          # Entwurf, bis alle Plattformen fertig sind. Erst dann sieht der
          # Updater das Release - sonst holt er sich ein halbes.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Android baut nicht in der Matrix oben mit: tauri-action kennt nur die
  # Desktop-Bundles. Der Weg dorthin ist ein eigener Job mit eigener
  # Werkzeugkette — dafür braucht niemand lokal ein SDK, der Runner bringt es
  # mit.
  android:
    name: Android (APK)
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # Gradle braucht ein JDK. Das Image bringt mehrere mit; 17 ist das, mit
      # dem das Android-Gradle-Plugin arbeitet.
      - name: JDK einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # SDK und NDK sind auf dem Runner vorhanden, aber Tauri sucht das NDK
      # unter NDK_HOME - und genau diese Variable setzt das Image nicht.
      - name: NDK-Pfad durchreichen
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable
        with:
          # Nur arm64: jedes Android-Gerät der letzten Jahre ist arm64, und
          # jedes weitere Ziel kostet einen kompletten Durchlauf.
          targets: aarch64-linux-android

      - name: Rust-Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android

      - name: npm-Pakete
        run: npm ci

      # Erzeugt src-tauri/gen/android. Bewusst bei jedem Lauf neu statt im
      # Repo: das Projekt ist erzeugter Code, und `tauri android init` schreibt
      # es zur jeweils installierten Tauri-Version passend.
      - name: Gradle-Projekt erzeugen
        run: npm run android:init

      # --debug, weil ein Release-APK einen Keystore bräuchte, den es noch
      # nicht gibt. Ein Debug-APK signiert Gradle selbst und lässt sich ganz
      # normal auf ein Gerät ziehen - zum Ausprobieren genau das Richtige.
      - name: APK bauen
        run: npm run android:build -- --debug --apk --target aarch64
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_APP_URL: ${{ secrets.VITE_PUBLIC_APP_URL }}

      - name: Zeigen, was entstanden ist
        run: find src-tauri/gen/android -name '*.apk' -exec ls -lh {} +

      # Auch ohne Tag abholbar - so lässt sich ein Android-Build über
      # workflow_dispatch ausprobieren, ohne eine Version zu verbrennen.
      - name: APK als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: planner-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # gh ist auf dem Runner vorinstalliert - das spart eine weitere Action
      # in der Lieferkette, nur um eine Datei anzuhängen.
      - name: APK an das Release hängen
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            $(find src-tauri/gen/android -name '*.apk') --clobber

  # Läuft nach allen Plattformen und beantwortet die eine Frage, die man
  # sonst erst nach der Installation stellt.
  check:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Sind die Supabase-Secrets gesetzt?
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "::warning::VITE_SUPABASE_ANON_KEY ist nicht gesetzt - die gebauten Apps laufen im lokalen Modus (kein Login, kein Sync)."
          else
            echo "Supabase-Secrets sind gesetzt."
          fi
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY fehlt - es entsteht kein signiertes Update, der Updater wird das Paket ablehnen."
            exit 1
          fi

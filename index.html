<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      viewport-fit=cover: sonst liegt die Fokus-Leiste auf Android unter der
      Gestenleiste. Kein user-scalable=no - das wuerde auch Pinch-Zoom
      abschalten. Gegen den Zoom beim Doppeltippen hilft touch-action:
      manipulation auf den Bedienelementen (siehe index.css).

      interactive-widget=resizes-content: Wenn die Tastatur aufgeht, soll die
      Seite kuerzer werden, statt dass die Tastatur sich darueberlegt. Ohne
      das bliebe die Schnellerfassung, die am unteren Rand klebt, hinter der
      Tastatur liegen - also genau das Feld, in das man gerade tippen wollte.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="Aufgaben und geteilte Listen" />
    <meta name="color-scheme" content="light dark" />
    <!-- Faerbt die Statusleiste auf Android passend zur App. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1116" />
    <title>Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

[package]
name = "planner"
version = "1.0.5"
description = "Fokus, Aufgaben und Gewohnheiten"
authors = ["Leif Sanden"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
# Der Name muss zu `planner_lib::run()` in main.rs passen. cdylib/staticlib
# braucht der Mobile-Build (Android laedt die App als native Bibliothek).
name = "planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# tray-icon ist kein Standard-Feature - ohne das gibt es kein Symbol im
# Infobereich bzw. in der Menuezeile.
# macos-private-api ist fuer das transparente Panel-Fenster noetig: Ohne das
# Feature ist WebviewWindowBuilder::transparent() auf macOS gar nicht erst
# vorhanden, und ein per Konfiguration transparentes Fenster laesst Tauri zur
# Laufzeit abbrechen.
tauri = { version = "2.11.3", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
# OAuth-Rueckweg: Google schickt den Code an planner://auth-callback, das
# System reicht ihn an die laufende App weiter.
tauri-plugin-deep-link = "2"
# Oeffnet die Anmeldeseite im Systembrowser statt in der App-WebView.
tauri-plugin-opener = "2"

# Nur Desktop: Android und iOS kennen weder globale Tastenkuerzel noch ein
# Konzept von "eine Instanz pro Rechner". Der Updater ist ebenfalls Desktop -
# auf Android laufen Aktualisierungen ueber den Store, nicht ueber die App.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# Zum Neustart nach dem Einspielen einer Aktualisierung.
tauri-plugin-process = "2"
# Platziert das Menueleisten-Panel unter dem Tray-Symbol. Ohne das muesste
# man die Bildschirmkoordinaten selbst ausrechnen - je Plattform anders.
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }

# Nur Android: die Bruecke zum Homescreen-Widget (Kotlin + RemoteViews).
#
# Bewusst nur hier und nicht in [dependencies]: das Plugin bringt einen
# Gradle-Teil mit, der ausserhalb eines Android-Builds nichts zu suchen hat.
# So bleibt der Desktop-Build von Aenderungen am Widget unberuehrt - und der
# ist es, der die Releases baut.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-planner-widget = { path = "plugins/planner-widget" }

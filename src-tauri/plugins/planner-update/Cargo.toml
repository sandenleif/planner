[package]
name = "tauri-plugin-planner-update"
version = "1.0.0"
description = "Aktualisierung der Android-App aus der App heraus"
authors = ["Leif Sanden"]
edition = "2021"
rust-version = "1.77.2"

# Siehe plugins/planner-widget/Cargo.toml: ohne `links` traegt Cargo den Pfad
# des Gradle-Teils nicht weiter, und das Kotlin landet nie im APK.
links = "tauri-plugin-planner-update"

[dependencies]
tauri = { version = "2.11.3" }
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
